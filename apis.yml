aid: intelycare
name: IntelyCare
description: >-
  IntelyCare is a healthcare workforce platform that connects post-acute and acute-care facilities with
  W2-employed per-diem nursing professionals ("IntelyPros") — RNs, LPNs and CNAs — through an app-based
  marketplace covering per-diem shifts, contract placements and travel assignments, plus credentialing,
  onboarding, continuing education (IntelyEdu) and 24/7 clinical support. For facilities it provides
  scheduling, shift-fill and timekeeping software. IntelyCare exposes a public External Scheduling REST
  API that lets a facility's own scheduling or EHR system programmatically create, update and cancel
  shift requests, exchange timecards for billing reconciliation, and post clock-in/clock-out events,
  with HMAC-signed webhooks pushing shift-accept and shift-release status back in real time. IntelyCare
  acquired CareRev in January 2026 and also operates the Credenza verified-nursing-identity job board.
