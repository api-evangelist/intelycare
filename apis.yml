apis:
- name: IntelyCare External Scheduling API
  description: >-
    REST API for integrating a facility's scheduling, EHR or workforce system with the IntelyCare Staffing
    platform. Clients create, update and delete shift requests, submit and update timecards for billing
    reconciliation, and post clock-in/clock-out events. All requests and responses are JSON-encoded;
    bulk operations are not supported (one object per request). Authentication is an X-API-KEY header
    scoped to a single client, paired with an X-CLIENT-ID header. Real-time shift status is pushed back
    via HMAC-SHA256-signed webhooks (Shift Accept, Shift Release).
  humanURL: https://apidocs.intelycare.com/
  baseURL: https://api.intelycare.com/external-scheduling/v1/
