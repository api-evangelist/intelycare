  body: {message: Unauthorized}
  header: WWW_Authenticate
  header_note: >-
    Declared with an underscore in the published spec; the RFC 9110 header is WWW-Authenticate.
gaps:
- No OAuth 2.0 or OpenID Connect; /.well-known/openid-configuration and
  /.well-known/oauth-authorization-server return 404 (www) / 403 (api host).
- No scope or permission model — a key is all-or-nothing inside its client scope.
- X-CLIENT-ID is a required credential-adjacent header but is not modelled as a securityScheme.
- No documented key rotation, expiry, or revocation process.
